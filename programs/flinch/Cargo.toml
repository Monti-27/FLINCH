[package]
name = "flinch"
version = "0.1.0"
description = "Core protocol for the FLINCH PvP holding game"
edition = "2021"
rust-version = "1.89.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "flinch"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "session-keys/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = "=1.0.2"
ephemeral-rollups-sdk = { version = "=0.17.0", features = ["anchor", "vrf"] }
ephemeral-spl-api = { git = "https://github.com/magicblock-labs/ephemeral-spl-token.git", rev = "7288a12befccc5541f3411b03699ba0f57e6c078" }
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }
wheels = { git = "https://github.com/magicblock-labs/magicblock-wheels.git" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
