[package]
name = "flinch-v2"
version = "0.2.0"
edition = "2021"
rust-version = "1.89.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "flinch_v2"

[features]
default = []
devnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022", "session-keys/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2", default-features = false, features = ["token", "associated_token"] }
flinch-domain = { path = "../../crates/flinch-domain" }
ephemeral-rollups-sdk = { version = "=0.17.0", features = ["anchor"] }
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
